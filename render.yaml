services:
  - type: web
    name: sakro-nestjs-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: URL
        value: https://sakro-nestjs-apis-8ln1.onrender.com/
      - key: whiteListedExtensions
        value: .jpg,.jpeg,.png,.gif,.mp4,.mov,.avi,.pdf,.doc,.docx,.txt,.m4a,.wav,.mp3
      - key: CLOUDINARY_CLOUD_NAME
        value: jqimomzw
      - key: CLOUDINARY_API_KEY
        value: "828366476286331"
      - key: CLOUDINARY_API_SECRET
        value: jZF8-zWR1_Wgps6RWL4tcPkyRO0
      # Stripe Connect — set in Render dashboard (do not commit live secrets)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "5"
      - key: STRIPE_CURRENCY
        value: usd
      - key: STRIPE_CONNECT_COUNTRY
        value: US
      - key: STRIPE_MERCHANT_COUNTRY
        value: US
      - key: STRIPE_MERCHANT_NAME
        value: JHAMAT
      - key: STRIPE_APPLE_MERCHANT_ID
        value: merchant.com.app.clothShopFlutter
      - key: STRIPE_GOOGLE_PAY_TEST_ENV
        value: "true"
      # Firebase Admin (FCM push) — the service account file is gitignored, so it is
      # NOT present on Render. Without this, push is silently skipped and only the
      # in-app notification record is created. Set in Render dashboard.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
